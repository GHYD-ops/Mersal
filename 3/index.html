<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Greeting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080C1A;
    --bg-2:#111A33;
    --gold:#C9D2E0;
    --gold-light:#F1F4F9;
    --gold-dark:#6E7A93;
    --wine:#0F1830;
    --cream:#EDEFF3;
    --muted:#7C8699;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, rgba(199,210,224,0.14), transparent 55%),
      radial-gradient(circle at 90% 100%, rgba(30,58,110,0.5), transparent 50%),
      var(--bg);
    font-family:'Tajawal', sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:36px 16px;
    overflow-x:hidden;
  }
  
  /* النجوم المتحركة في الخلفية */
  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .stars span{
    position:absolute;
    background:#EDEFF3;
    border-radius:50%;
    opacity:0.5;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.4); }
  }

  /* ---------------- شاشة البداية (كوكبة الميزان) ---------------- */
  .intro-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }
  .intro-screen.hidden {
    opacity: 0;
    visibility: hidden;
  }
  
  .constellation {
    width: 250px;
    height: 250px;
  }
  .constellation line {
    stroke: var(--gold-dark);
    stroke-width: 1.2;
    opacity: 0;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw-line 2s 0.8s ease-in-out forwards;
  }
  .constellation circle {
    fill: var(--gold-light);
    opacity: 0;
    filter: drop-shadow(0 0 4px var(--gold-light));
  }
  
  /* توقيت ظهور نجوم الكوكبة بشكل متسلسل */
  .constellation circle:nth-child(1) { animation: fade-star 1s 0.2s forwards; }
  .constellation circle:nth-child(2) { animation: fade-star 1s 0.6s forwards; }
  .constellation circle:nth-child(3) { animation: fade-star 1s 1.0s forwards; }
  .constellation circle:nth-child(4) { animation: fade-star 1s 1.4s forwards; }
  .constellation circle:nth-child(5) { animation: fade-star 1s 1.8s forwards; }

  @keyframes draw-line {
    to { stroke-dashoffset: 0; opacity: 0.6; }
  }
  @keyframes fade-star {
    to { opacity: 1; }
  }

  /* ---------------- البطاقة ---------------- */
  #fwCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
  }
  
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, rgba(17, 26, 51, 0.65), rgba(8, 12, 26, 0.85));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border:1px solid rgba(199,210,224,0.25);
    border-radius:18px;
    padding:46px 26px 30px; /* تم زيادة المساحة العلوية بعد إزالة الزخرفة */
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.6);
    
    /* مخفية بالبداية الين ينتهي مشهد الميزان */
    opacity: 0;
    transform: translateY(30px) scale(0.95);
    pointer-events: none;
  }
  
  /* أنيميشن دخول البطاقة بعد الانتهاء */
  .card.show-card {
    pointer-events: auto;
    animation: fade-up 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card::after{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(199,210,224,0.18);
    border-radius:12px;
    pointer-events:none;
  }
  
  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    opacity: 0.85;
  }
  .corner.tl { top: 14px; left: 14px; border-top: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
  .corner.tr { top: 14px; right: 14px; border-top: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }
  .corner.bl { bottom: 14px; left: 14px; border-bottom: 1.5px solid var(--gold); border-left: 1.5px solid var(--gold); }
  .corner.br { bottom: 14px; right: 14px; border-bottom: 1.5px solid var(--gold); border-right: 1.5px solid var(--gold); }

  .corner::after {
    content: "";
    position: absolute;
    width: 4px; height: 4px;
    background: var(--gold);
    border-radius: 50%;
  }
  .corner.tl::after { top: -2.5px; left: -2.5px; }
  .corner.tr::after { top: -2.5px; right: -2.5px; }
  .corner.bl::after { bottom: -2.5px; left: -2.5px; }
  .corner.br::after { bottom: -2.5px; right: -2.5px; }

  .sparkle{
    position:absolute;
    color:var(--gold-light);
    font-size:11px;
    opacity:0;
    animation:sparkle-drift 6s ease-in-out infinite;
    pointer-events:none;
  }
  .sparkle.s1{ top:18%; left:12%; animation-delay:0s; }
  .sparkle.s2{ top:32%; right:14%; animation-delay:1.6s; }
  .sparkle.s3{ top:68%; left:9%; animation-delay:3.2s; }
  .sparkle.s4{ top:78%; right:11%; animation-delay:4.6s; }
  @keyframes sparkle-drift{
    0%{ opacity:0; transform:translateY(6px) scale(0.6) rotate(0deg); }
    15%{ opacity:0.9; }
    50%{ opacity:0.5; transform:translateY(-6px) scale(1) rotate(90deg); }
    85%{ opacity:0.9; }
    100%{ opacity:0; transform:translateY(-14px) scale(0.6) rotate(180deg); }
  }
  
  .signature-icon{
    display:inline-block;
    margin-right:6px;
    opacity:0.85;
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:3px;
    color:var(--gold);
    margin:0 0 10px;
    font-weight:500;
  }
  h1{
    font-family:'El Messiri', sans-serif;
    font-weight:700;
    font-size:36px;
    line-height:1.35;
    margin:0 0 8px;
    background:linear-gradient(110deg, var(--gold-dark) 20%, var(--gold-light) 40%, var(--gold-light) 50%, var(--gold-dark) 70%);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shimmer 5s linear infinite;
  }
  @keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }
  .sub{
    font-size:15px;
    color:var(--muted);
    margin:0 0 30px;
    line-height:1.7;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:26px 0 22px;
    opacity:0.6;
  }
  .divider .line{
    height:1px;
    width:60px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider .dot{
    width:5px;height:5px;
    background:var(--gold);
    transform:rotate(45deg);
  }

  .launch-btn{
    position:relative;
    width:78px; height:78px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold-dark));
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin:6px auto 0;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    transition:transform .3s ease;
  }
  .launch-btn:active{ transform:scale(0.94); }
  .launch-btn.launched{
    animation:launch-pop .5s ease;
  }
  @keyframes launch-pop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }
  .launch-glow{
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:1.5px solid rgba(199,210,224,0.5);
    animation:pulse-ring 2.2s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(0.85); opacity:0.8; }
    100%{ transform:scale(1.35); opacity:0; }
  }
  .launch-btn.launched .launch-glow{ animation:none; opacity:0; }

  .message-card{
    margin-top:26px;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transform:scale(0.94);
    transition:opacity .6s ease, max-height .6s ease, transform .6s cubic-bezier(.22,1,.36,1);
  }
  .message-card.show{
    opacity:1;
    max-height:400px;
    transform:scale(1);
  }
  .message-card p{
    font-size:17px;
    line-height:1.9;
    margin:0;
    color:var(--cream);
    min-height: 100px;
  }
  .typing-cursor::after {
    content: '|';
    animation: blink 1s step-start infinite;
    color: var(--gold-light);
    margin-right: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .from{
    display:block;
    margin-top:22px;
    font-family:'El Messiri', sans-serif;
    font-size:18px;
    color:var(--gold);
  }

  footer{
    margin-top:24px;
    font-size:12px;
    color:#5C5568;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- شاشة البداية: كوكبة الميزان -->
<div class="intro-screen" id="introScreen">
  <svg class="constellation" viewBox="0 0 200 200">
    <!-- النجوم -->
    <circle cx="150" cy="40" r="3"/> <!-- Zubeneschamali -->
    <circle cx="120" cy="110" r="3.5"/> <!-- Zubenelgenubi -->
    <circle cx="50" cy="90" r="2.5"/> <!-- Zubenelhakrabi -->
    <circle cx="100" cy="160" r="3"/> <!-- Brachium -->
    <circle cx="30" cy="50" r="2"/> <!-- Zubenelakrab -->
    
    <!-- الخطوط المتصلة -->
    <line x1="150" y1="40" x2="120" y2="110"/>
    <line x1="120" y1="110" x2="50" y2="90"/>
    <line x1="50" y1="90" x2="100" y2="160"/>
    <line x1="120" y1="110" x2="100" y2="160"/>
    <line x1="50" y1="90" x2="30" y2="50"/>
  </svg>
</div>

<!-- البطاقة الرئيسية -->
<div class="card" id="mainCard">
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <span class="sparkle s1">✦</span>
  <span class="sparkle s2">✦</span>
  <span class="sparkle s3">✦</span>
  <span class="sparkle s4">✦</span>

  <p class="eyebrow">1 OCT 2000</p>
  <h1>Happy Birthday My Star</h1>
  <p class="sub" id="launchHint">Tap 🪄</p>

  <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>

  <button class="launch-btn" id="launchBtn" aria-label="ابدئي الاحتفال">
    <span class="launch-glow"></span>
    <svg width="34" height="34" viewBox="0 0 24 24">
      <path d="M12 1 L14.5 8.5 L22 11 L14.5 13.5 L12 21 L9.5 13.5 L2 11 L9.5 8.5 Z" fill="#0B0A10"/>
    </svg>
  </button>

  <div class="message-card" id="messageCard">
    <p id="typewriterText" class="typing-cursor"></p>
  </div>

  <span class="from"><span class="signature-icon">✦</span>And I'm always here for you</span>

  <footer>With all love MERSAL</footer>
</div>

<canvas id="fwCanvas"></canvas>

<script>
  // التحكم في مشهد الدخول (الميزان)
  window.addEventListener('load', function() {
    setTimeout(function() {
      document.getElementById('introScreen').classList.add('hidden');
      document.getElementById('mainCard').classList.add('show-card');
    }, 3800); // إخفاء الكوكبة وظهور البطاقة بعد 3.8 ثواني
  });

  var launchBtn = document.getElementById('launchBtn');
  var launchHint = document.getElementById('launchHint');
  var messageCard = document.getElementById('messageCard');
  var typewriterText = document.getElementById('typewriterText');
  var launched = false;
  
  var fullMessage = "Just like the stars light up the night sky, your presence lights up my world. Wishing you a year filled with magic, endless laughter, and all the happiness your beautiful heart can hold. Keep shining!";

  function typeWriter(text, i) {
    if (i < text.length) {
      typewriterText.innerHTML += text.charAt(i);
      setTimeout(function() {
        typeWriter(text, i + 1);
      }, 45); 
    } else {
      typewriterText.classList.remove('typing-cursor');
    }
  }

  var fwCanvas = document.getElementById('fwCanvas');
  var fctx = fwCanvas.getContext('2d');
  var particles = [];
  var rockets = [];
  var rafId = null;
  var fwColors = ['#C9D2E0', '#F1F4F9', '#EDEFF3', '#8FA0C4', '#6E7A93'];

  function sizeFwCanvas(){
    fwCanvas.width = window.innerWidth;
    fwCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', sizeFwCanvas);
  sizeFwCanvas();

  function explode(x, y){
    var count = 50;
    for(var i = 0; i < count; i++){
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
      var speed = 2 + Math.random() * 3.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.008 + Math.random() * 0.01,
        color: fwColors[Math.floor(Math.random() * fwColors.length)],
        size: 1.5 + Math.random() * 2
      });
    }
  }

  function launchRocket(fromX){
    var targetY = fwCanvas.height * (0.2 + Math.random() * 0.3);
    rockets.push({
      x: fromX,
      y: fwCanvas.height,
      targetY: targetY,
      vy: -8 - Math.random() * 2,
      trail: []
    });
    if(!rafId) runLoop();
  }

  function runLoop(){
    fctx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

    for(var i = rockets.length - 1; i >= 0; i--){
      var r = rockets[i];
      r.y += r.vy;
      r.vy += 0.04;
      r.trail.push({ x: r.x, y: r.y });
      if(r.trail.length > 6) r.trail.shift();

      fctx.beginPath();
      for(var j = 0; j < r.trail.length; j++){
        var p = r.trail[j];
        fctx.globalAlpha = j / r.trail.length * 0.5;
        fctx.fillStyle = '#F1F4F9';
        fctx.fillRect(p.x - 1, p.y - 1, 2, 2);
      }
      fctx.globalAlpha = 1;

      if(r.y <= r.targetY || r.vy >= 0){
        explode(r.x, r.y);
        rockets.splice(i, 1);
      }
    }

    for(var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.vx *= 0.98;
      p.life -= p.decay;
      if(p.life <= 0){
        particles.splice(i, 1);
        continue;
      }
      fctx.globalAlpha = Math.max(p.life, 0);
      fctx.fillStyle = p.color;
      fctx.beginPath();
      fctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fctx.fill();
    }
    fctx.globalAlpha = 1;

    if(particles.length > 0 || rockets.length > 0){
      rafId = requestAnimationFrame(runLoop);
    } else {
      rafId = null;
    }
  }

  function startFireworks(){
    var w = fwCanvas.width;
    var positions = [w * 0.25, w * 0.5, w * 0.75, w * 0.35, w * 0.65];
    positions.forEach(function(x, idx){
      setTimeout(function(){ launchRocket(x); }, idx * 400);
    });
  }

  launchBtn.addEventListener('click', function(){
    if(launched) return;
    launched = true;
    launchBtn.classList.add('launched');
    launchHint.textContent = 'Enjoy the fireworks!';
    startFireworks();
    
    setTimeout(function(){
      messageCard.classList.add('show');
      setTimeout(function(){
        typeWriter(fullMessage, 0);
      }, 400);
    }, 500);
  });

  (function makeStars(){
    var field = document.getElementById('stars');
    var count = 40;
    for(var i = 0; i < count; i++){
      var s = document.createElement('span');
      var size = (Math.random() * 2 + 1).toFixed(1);
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.animationDelay = (Math.random() * 3.5).toFixed(2) + 's';
      s.style.animationDuration = (2.5 + Math.random() * 3).toFixed(2) + 's';
      field.appendChild(s);
    }
  })();
</script>

</body>
</html>
