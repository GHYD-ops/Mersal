<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Lolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0B0102;
    --red-main: #D91A33;
    --red-glow: #FF4D60;
    --gold: #D4AF37;
    --card-glass: rgba(255, 255, 255, 0.03);
    --card-border: rgba(217, 26, 51, 0.3);
    --text-light: #FDF2F4;
    --text-dim: #D9C3C6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 150%, #3B0912 0%, var(--bg-dark) 80%);
    font-family: 'Montserrat', sans-serif;
    color: var(--text-light);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Stars Background */
  .stars {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #FFF;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--duration) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 0.8; transform: scale(1); box-shadow: 0 0 5px #FFF; }
  }

  /* Elegant Ruby Glass Balloons */
  .glass-balloon {
    position: absolute;
    bottom: -100px;
    width: 45px;
    height: 55px;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(217,26,51,0.15));
    border: 1px solid rgba(217,26,51,0.3);
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: floatBalloon linear infinite;
    z-index: 1;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
  }
  .glass-balloon::after {
    content: '';
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 40px;
    background: linear-gradient(180deg, rgba(217,26,51,0.5), transparent);
  }

  @keyframes floatBalloon {
    0% { transform: translateY(0) rotate(-5deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(5deg); opacity: 0; }
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 460px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
  }

  /* === Swinging Red Butterfly === */
  .pendulum-container {
    position: absolute;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: top center;
    animation: swingSides 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    z-index: 10;
  }

  @keyframes swingSides {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .red-thread {
    width: 1px;
    height: 110px;
    background: linear-gradient(180deg, rgba(217,26,51,0.8), rgba(217,26,51,0.1));
    box-shadow: 0 0 8px var(--red-main);
  }

  .butterfly {
    width: 60px;
    height: 60px;
    margin-top: -5px;
    filter: drop-shadow(0 0 15px var(--red-glow));
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* === Glassmorphism Card === */
  .glass-card {
    background: var(--card-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    padding: 45px 30px 35px;
    text-align: center;
    width: 100%;
    margin-top: 130px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(217,26,51,0.05);
    opacity: 0;
    transform: translateY(30px);
    animation: floatUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
  }

  @keyframes floatUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--red-glow);
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 600;
    margin: 0 0 15px;
    background: linear-gradient(to right, #FFF, var(--red-glow), #FFF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 20px rgba(217, 26, 51, 0.4);
  }

  .elegant-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .elegant-divider::before, .elegant-divider::after {
    content: '';
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--red-main));
  }
  .elegant-divider::after {
    background: linear-gradient(270deg, transparent, var(--red-main));
  }
  .elegant-divider span {
    color: var(--red-main);
    margin: 0 10px;
    font-size: 12px;
  }

  /* Cinematic Smooth Reveal Text */
  .message {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text-dim);
    font-weight: 300;
    min-height: 90px;
    margin-bottom: 20px;
  }
  .message span {
    opacity: 0;
    display: inline-block;
    animation: smoothReveal 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @keyframes smoothReveal {
    0% { opacity: 0; transform: translateY(10px); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* === Minimalist Cake === */
  .cake-container {
    opacity: 0;
    animation: smoothReveal 2s forwards 3s;
    margin-bottom: 20px;
    position: relative;
  }

  .cake-svg {
    width: 60px;
    height: auto;
    filter: drop-shadow(0 0 10px rgba(217, 26, 51, 0.2));
  }

  .candle-flame {
    transform-origin: bottom center;
    animation: flicker 0.5s infinite alternate;
    transition: all 0.5s ease;
  }

  @keyframes flicker {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.8); opacity: 0.8; }
  }

  /* Interactive Button */
  .magic-btn {
    background: rgba(217, 26, 51, 0.1);
    border: 1px solid rgba(217, 26, 51, 0.5);
    color: var(--red-glow);
    padding: 10px 22px;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: smoothReveal 2s forwards 3.5s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .magic-btn:hover {
    background: var(--red-main);
    color: #FFF;
    box-shadow: 0 0 20px rgba(217, 26, 51, 0.5);
  }

  /* Ruby/Gold Dust Confetti */
  .gold-dust {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
</style>
</head>
<body>

<!-- Background Elements -->
<div class="stars" id="stars"></div>
<div id="balloons-container"></div>

<div class="stage">
  <!-- Glowing Red Butterfly -->
  <div class="pendulum-container">
    <div class="red-thread"></div>
    <svg class="butterfly" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF" />
          <stop offset="50%" stop-color="#FF4D60" />
          <stop offset="100%" stop-color="#D91A33" />
        </linearGradient>
      </defs>
      <path d="M48 20 C 20 -5, -5 40, 25 65 C 35 75, 48 55, 48 55 Z" fill="url(#glowGrad)" opacity="0.85"/>
      <path d="M48 55 C 30 65, 10 95, 40 98 C 45 98, 48 80, 48 55 Z" fill="url(#glowGrad)" opacity="0.6"/>
      <path d="M52 20 C 80 -5, 105 40, 75 65 C 65 75, 52 55, 52 55 Z" fill="url(#glowGrad)" opacity="0.85"/>
      <path d="M52 55 C 70 65, 90 95, 60 98 C 55 98, 52 80, 52 55 Z" fill="url(#glowGrad)" opacity="0.6"/>
      <rect x="49" y="15" width="2" height="40" rx="1" fill="#FFF"/>
    </svg>
  </div>

  <!-- Main Card -->
  <div class="glass-card">
    <div class="eyebrow">To the most beautiful soul</div>
    <div class="name">Lolo</div>
    
    <div class="elegant-divider"><span>✦</span></div>
    
    <div class="message" id="msgBox"></div>

    <!-- Elegant Cake Drawing -->
    <div class="cake-container" id="cakeContainer">
      <svg class="cake-svg" viewBox="0 0 100 100">
        <!-- Plate -->
        <line x1="20" y1="90" x2="80" y2="90" stroke="#FF4D60" stroke-width="2" stroke-linecap="round"/>
        <!-- Bottom Tier -->
        <rect x="30" y="65" width="40" height="25" fill="rgba(217,26,51,0.1)" stroke="#FF4D60" stroke-width="1.5" rx="3"/>
        <!-- Top Tier -->
        <rect x="40" y="45" width="20" height="20" fill="rgba(217,26,51,0.2)" stroke="#FF4D60" stroke-width="1.5" rx="3"/>
        <!-- Candle -->
        <rect x="48" y="25" width="4" height="20" fill="#FFF" opacity="0.9"/>
        <!-- Flame (Gold) -->
        <path id="flame" class="candle-flame" d="M50 12 Q 54 18 50 25 Q 46 18 50 12 Z" fill="#D4AF37"/>
      </svg>
    </div>
    
    <button class="magic-btn" id="wishBtn" onclick="makeWish()">
      <span>✨</span> Make a wish & blow the candle
    </button>
  </div>
</div>

<script>
  // 1. Cinematic Typewriter effect for the message
  const text = "Happy Birthday to the light of my life. You are the most beautiful coincidence. I wish you a year as pure and sweet as your heart, filled with tenderness and joy.";
  const msgBox = document.getElementById("msgBox");
  const words = text.split(" ");
  
  setTimeout(() => {
    words.forEach((word, index) => {
      const span = document.createElement("span");
      span.textContent = word;
      
      span.style.animationDelay = `${index * 0.06}s`; 
      msgBox.appendChild(span);
      
      msgBox.appendChild(document.createTextNode(" "));
    });
  }, 1200);

  // 2. Generate ambient stars
  const starsContainer = document.getElementById("stars");
  for (let i = 0; i < 60; i++) {
    const star = document.createElement("div");
    star.className = "star";
    const size = Math.random() * 2.5;
    star.style.width = `${size}px`;
    star.style.height = `${size}px`;
    star.style.left = `${Math.random() * 100}vw`;
    star.style.top = `${Math.random() * 100}vh`;
    star.style.setProperty("--duration", `${2 + Math.random() * 4}s`);
    star.style.animationDelay = `${Math.random() * 3}s`;
    starsContainer.appendChild(star);
  }

  // 3. Generate floating ruby glass balloons
  const balloonsContainer = document.getElementById("balloons-container");
  for (let i = 0; i < 8; i++) {
    const balloon = document.createElement("div");
    balloon.className = "glass-balloon";
    balloon.style.left = `${10 + Math.random() * 80}vw`;
    balloon.style.animationDuration = `${10 + Math.random() * 10}s`;
    balloon.style.animationDelay = `${Math.random() * 5}s`;
    balloonsContainer.appendChild(balloon);
  }

  // 4. Make a wish function
  function makeWish() {
    // Extinguish the candle flame softly
    const flame = document.getElementById("flame");
    flame.style.transform = "scale(0)";
    flame.style.opacity = "0";

    // Update button text
    const btn = document.getElementById("wishBtn");
    btn.innerHTML = "Happy Birthday Lolo! ♥";
    btn.style.pointerEvents = "none";
    btn.style.background = "rgba(217, 26, 51, 0.2)";
    btn.style.color = "#FF4D60";
    btn.style.border = "1px solid rgba(217, 26, 51, 0.3)";
    btn.style.boxShadow = "none";

    // Trigger elegant ruby & gold dust explosion
    const cakeRect = document.getElementById("cakeContainer").getBoundingClientRect();
    const centerX = cakeRect.left + cakeRect.width / 2;
    const centerY = cakeRect.top;

    for (let i = 0; i < 40; i++) {
      const dust = document.createElement("div");
      dust.className = "gold-dust";
      
      // مزج الشظايا بين الذهبي والأحمر المتوهج
      const isGold = Math.random() > 0.5;
      dust.style.background = isGold ? "#D4AF37" : "#FF4D60";
      dust.style.boxShadow = isGold ? "0 0 8px #D4AF37" : "0 0 8px #FF4D60";
      
      document.body.appendChild(dust);

      const angle = Math.random() * Math.PI * 2;
      const velocity = 50 + Math.random() * 100;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity - 50;

      dust.style.left = `${centerX}px`;
      dust.style.top = `${centerY}px`;
      
      dust.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 1000 + Math.random() * 1000,
        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
        fill: 'forwards'
      });

      setTimeout(() => dust.remove(), 2000);
    }
  }
</script>

</body>
</html>
